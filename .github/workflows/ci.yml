name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify FERNET_KEY present
        run: |
          if [ -z "${{ secrets.FERNET_KEY }}" ]; then
            echo "FERNET_KEY secret is required" && exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint (active packages)
        run: |
          flake8 app bot platform_runtime.py run_test_v2.py rq_tasks.py \
            --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test
        env:
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
          FLASK_SECRET_KEY: ci-secret
          JWT_SECRET_KEY: ci-jwt-secret
          FLASK_DEBUG: "true"
        run: pytest -q tests/

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy note
        run: echo "Deploy via docker compose or start_platform.sh — configure secrets in the host environment."
