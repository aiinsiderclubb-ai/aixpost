name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify FERNET_KEY present
        run: |
          if [ -z "${{ secrets.FERNET_KEY }}" ]; then
            echo "FERNET_KEY secret is required" && exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint
        run: flake8 .

      - name: Test
        env:
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
        run: pytest -q

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Mock deploy to Render
        run: echo "Deploying to Render... (mock)"
      - name: Mock deploy to Vercel
        run: echo "Deploying to Vercel... (mock)"



